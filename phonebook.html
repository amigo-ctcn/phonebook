<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>分機查詢系統（新店校區）</title>
<style>
  :root{
    --bg:#f3f4f6;--card:#ffffff;--text:#1f2937;--muted:#6b7280;
    --accent:#2563eb;--accent-light:#dbeafe;
    --shadow:0 8px 24px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0b1220;--card:#111827;--text:#f9fafb;--muted:#9ca3af;
    --accent:#3b82f6;--accent-light:#172554;--shadow:0 8px 24px rgba(0,0,0,0.6);} }
  html,body{height:100%;margin:0;font-family:system-ui,'Noto Sans TC',Arial;background:var(--bg);color:var(--text);}
  body{display:flex;justify-content:center;padding:20px}
  .container{width:100%;max-width:820px;margin-top:20px;text-align:center}
  h1{font-size:22px;margin:0 0 12px;font-weight:700}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:14px;padding:16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);}
  .controls>*{flex:1;min-width:160px}
  input,select{padding:12px;border-radius:10px;border:1px solid #d1d5db;font-size:16px;width:100%;box-sizing:border-box}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
  #resultWrap{display:none;margin-top:16px}
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .tableWrap{max-height:56vh;overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:600px}
  th,td{padding:12px;text-align:left;border-bottom:1px solid rgba(0,0,0,0.06)}
  th{position:sticky;top:0;background:var(--card);color:var(--accent)}
  .small{font-size:13px;color:var(--muted);padding:12px;text-align:left}
  .highlight{color:var(--accent);font-weight:600}

@media print {

  /* 隱藏搜尋列 */
  .controls {
    display: none !important;
  }

  /* 取消捲動容器限制（重點） */
  .tableWrap {
    max-height: none !important;
    overflow: visible !important;
  }

  /* 表格允許自動分頁 */
  table {
    page-break-inside: auto;
  }

  tr {
    page-break-inside: avoid;
    page-break-after: auto;
  }

  thead {
    display: table-header-group;
  }

  body {
    padding: 0;
  }

  .container {
    max-width: none;
    margin: 0;
  }
}
  
</style>
</head>

<div class="container">
<h1>分機查詢系統（新店校區）</h1>
<div class="small" id="lastUpdate"></div>

<div class="controls">

<button onclick="printTable()">列印</button>

</div>


<div id="resultWrap">

        <thead>

        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="empty" class="small" style="display:none">無符合資料</div>
  </div>
</div>
</div>

  const csv = PHONEBOOK_DATA
    .map(r => r.map(v => `"${(v??'').toString().replace(/"/g,'""')}"`).join(','))
    .join('\n');

  const BOM = '\uFEFF';
  const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'phonebook.csv';
  a.click();
}

<script>
function normalizeText(str){
  return (str||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
}
function fuzzyRegex(str){
  if(!str) return null;
  const chars = normalizeText(str).split('');
  return chars.length ? new RegExp(chars.join('.*'),'i') : null;
}

const data = PHONEBOOK_DATA;
const rows = data.slice(1).map(r=>({
  部門:r[0], 姓名:r[1], 分機:r[2], 教室編號:r[3]
}));

const searchInput=document.getElementById('search');
const deptFilter=document.getElementById('deptFilter');
const tbody=document.getElementById('tbody');
const emptyDiv=document.getElementById('empty');
const countDiv=document.getElementById('count');
const resultWrap=document.getElementById('resultWrap');

[...new Set(rows.map(r=>r.部門).filter(Boolean))]
  .sort((a,b)=>a.localeCompare(b,'zh-Hant-TW'))
  .forEach(d=>{
    const o=document.createElement('option');
    o.value=o.textContent=d;
    deptFilter.appendChild(o);
  });

function render(){
  const kwRaw = searchInput.value.trim();
  const dept  = deptFilter.value;

  // ✅ 永遠顯示結果區
  resultWrap.style.display = 'block';

  const regex = fuzzyRegex(kwRaw);
  const isNumeric = /^[0-9]+$/.test(kwRaw);

  const filtered = rows.filter(r=>{
    if(dept && r.部門 !== dept) return false;
    if(!kwRaw) return true;
    if(isNumeric) return r.分機 && r.分機.toString().includes(kwRaw);
    const textHay = normalizeText(r.部門 + r.姓名);
    return regex
      ? regex.test(textHay)
      : textHay.includes(normalizeText(kwRaw));
  });

  tbody.innerHTML = '';
  if(filtered.length === 0){
    emptyDiv.style.display = 'block';
    countDiv.textContent = '共 0 筆';
    return;
  }

  emptyDiv.style.display = 'none';
  countDiv.innerHTML = `共 <span class="highlight">${filtered.length}</span> 筆`;

  filtered.forEach(r=>{
    tbody.innerHTML += `<tr>
      <td>${r.部門}</td>
      <td>${r.姓名}</td>
      <td>${r.分機}</td>
      <td>${r.教室編號}</td>
    </tr>`;
  });
}

searchInput.addEventListener('input',render);
deptFilter.addEventListener('change',render);

render();
</script>
