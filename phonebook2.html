<title>分機查詢系統（宜蘭校區）</title>
<style>
  :root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent-light:#dbeafe;
    --shadow:0 8px 24px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220;
      --card:#111827;
      --text:#f9fafb;
      --muted:#9ca3af;
      --accent:#3b82f6;
      --accent-light:#172554;
      --shadow:0 8px 24px rgba(0,0,0,0.6);
    }
  }

  html,body{height:100%;margin:0;font-family:system-ui,'Noto Sans TC',Arial;background:var(--bg);color:var(--text);}
  body{display:flex;justify-content:center;padding:20px}
  .container{width:100%;max-width:820px;margin-top:20px;text-align:center;animation:fadeIn .36s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:22px;margin:0 0 12px;font-weight:700}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:14px;padding:16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);}
  .controls > *{flex:1;min-width:160px}
  input[type="text"],select{padding:12px;border-radius:10px;border:1px solid #d1d5db;font-size:16px;width:100%;box-sizing:border-box;transition:.12s}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
  #resultWrap{display:none;margin-top:16px}
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
  .tableWrap{max-height:56vh;overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:600px}
  th,td{padding:12px;text-align:left;border-bottom:1px solid rgba(0,0,0,0.06)}
  th{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);cursor:pointer;position:sticky;top:0;z-index:3;color:var(--accent);font-weight:700}
  tr:hover td{background:rgba(37,99,235,0.04)}
  @media (max-width:720px){
    .controls{flex-direction:column;align-items:stretch}
    table{min-width:100%}
    th:nth-child(4),td:nth-child(4){display:none}
  }
  .small{font-size:13px;color:var(--muted);padding:12px;text-align:left}
  .meta{display:flex;justify-content:space-between;padding:10px 14px;color:var(--muted);font-size:13px}
  .highlight{color:var(--accent);font-weight:600}
</style>
</head>
<body>
  <div class="container">
    <h1>分機查詢系統（宜蘭校區）</h1>

    <div class="controls" role="region" aria-label="搜尋控制">
      <input id="search" type="text" placeholder="輸入關鍵字（姓名 / 部門 / 分機 / 教室編號），輸入任一字即可模糊搜尋" aria-label="搜尋欄" />
      <select id="deptFilter" aria-label="部門篩選"><option value="">全部部門</option></select>
      <select id="sortBy" aria-label="排序方式">
        <option value="">不排序</option>
        <option value="部門">依部門</option>
        <option value="姓名">依姓名</option>
        <option value="分機">依分機</option>
      </select>
    </div>

    <div id="resultWrap">
      <div class="card">
        <div class="meta"><div id="count" class="small"></div><div class="small">點標題可快速排序（或用右側下拉）</div></div>
        <div class="tableWrap" id="tableWrap">
          <table id="table" role="table" aria-label="查詢結果">
            <thead>
              <tr>
                <th data-key="部門">部門</th>
                <th data-key="姓名">姓名/職稱</th>
                <th data-key="分機">分機</th>
                <th data-key="教室編號">教室編號</th>

            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="empty" class="small" style="display:none">無符合資料。</div>
      </div>
    </div>

  </div>

/* 轉成物件列表。注意：將 '教室編號' 設為 '辦公室編號' 方便沿用新店的 JS 邏輯 */
const rows = data.slice(1).map(r=>({部門:r[0],姓名:r[1],分機:r[2],辦公室編號:r[3]})); // 用辦公室編號來對應欄位

const tbody = document.getElementById('tbody');
const searchInput = document.getElementById('search');
const deptFilter = document.getElementById('deptFilter');
const sortBySelect = document.getElementById('sortBy');
const emptyDiv = document.getElementById('empty');
const resultWrap = document.getElementById('resultWrap');
const countDiv = document.getElementById('count');
const tableWrap = document.getElementById('tableWrap');

function populateDept(){
  const depts = Array.from(new Set(rows.map(r=>r.部門).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'zh-Hant-TW'));
  deptFilter.innerHTML = '<option value="">全部部門</option>' + depts.map(d=>`<option value="${escapeHtmlAttr(d)}">${escapeHtml(d)}</option>`).join('');
}

/* escape helpers */
function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeHtmlAttr(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* fuzzy regex builder: 將每個字串字元拆開並以 .* 連接 (過濾空白) */
function fuzzyRegex(str){
  if(!str) return null;
  // 若輸入包含空白，把空白視為多字分隔 (保留所有非空字)
  const chars = str.split('').filter(ch=>ch.trim()!=='').map(ch=>ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(chars.length===0) return null;
  return new RegExp(chars.join('.*'),'i');
}

/* debounce for input */
let inputTimer = null;
function onInputChange(){
  clearTimeout(inputTimer);
  inputTimer = setTimeout(render, 150); // 150ms debounce for snappy feel
}

function render(){
  const kwRaw = searchInput.value.trim();
  const kwLower = kwRaw.toLowerCase();
  const dept = deptFilter.value;

  // hide results when nothing entered and no dept selected
  if(!kwRaw && !dept){
    resultWrap.style.display='none';
    return;
  }
  resultWrap.style.display='block';

  const regex = fuzzyRegex(kwRaw);
  let filtered = rows.filter(r=>{
    if(dept && r.部門 !== dept) return false;
    if(!kwRaw) return true;
    // combine searchable fields
    const hay = [r.部門,r.姓名,r.分機,r.辦公室編號].join(' ');
    return regex ? regex.test(hay) : hay.toLowerCase().includes(kwLower);
  });

  // sorting
  const sortKey = sortBySelect.value;
  if(sortKey){
    filtered.sort((a,b)=>{
      const A = (a[sortKey]||'').toString();
      const B = (b[sortKey]||'').toString();
      if(sortKey==='分機'){
        // prefer numeric compare for phone-like fields
        const nA = A.replace(/[^0-9]/g,'');
        const nB = B.replace(/[^0-9]/g,'');
        if(nA && nB) return parseInt(nA,10) - parseInt(nB,10);
      }
      return A.localeCompare(B,'zh-Hant-TW',{numeric:true});
    });
  }

  // render
  if(filtered.length===0){
    tbody.innerHTML='';
    emptyDiv.style.display='block';
    countDiv.innerHTML = `<span class="small">共 0 筆</span>`;
    return;
  }
  emptyDiv.style.display='none';
  countDiv.innerHTML = `<span class="small">共 <span class="highlight">${filtered.length}</span> 筆</span>`;

  tbody.innerHTML = filtered.map(r=>{
    return `<tr><td>${escapeHtml(r.部門)}</td><td>${escapeHtml(r.姓名)}</td><td>${escapeHtml(r.分機)}</td><td>${escapeHtml(r.辦公室編號)}</td></tr>`;
  }).join('');
}

/* header click sorting */
document.querySelectorAll('th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    sortBySelect.value = th.getAttribute('data-key');
    render();
    // 滾回表格頂端
    tableWrap.scrollTop = 0;
  });
});

/* events */
searchInput.addEventListener('input', onInputChange);
deptFilter.addEventListener('input', render);
sortBySelect.addEventListener('input', render);

/* init */
populateDept();

/* optional: if user presses Enter on search, scroll first match into view */
searchInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); render(); const firstRow = tbody.querySelector('tr'); if(firstRow) firstRow.scrollIntoView({behavior:'smooth',block:'center'}); }
});
</script>
