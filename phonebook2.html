<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分機查詢系統（宜蘭校區）</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>分機查詢系統（宜蘭校區）</h1>
    <div class="small" id="lastUpdate"></div>

    <div class="controls">
      <input id="search" type="text" placeholder="輸入姓名 / 職稱 / 部門 / 教室編號" />
      <select id="deptFilter"><option value="">全部部門</option></select>
      <button onclick="printTable()">列印</button>
      <button onclick="exportCSV()">匯出 CSV</button>
    </div>

    <div id="resultWrap">
      <div class="card">
        <div class="small" id="count"></div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr><th>部門</th><th>姓名 / 職稱</th><th>分機</th><th>教室編號</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="empty" class="small" style="display:none">無符合資料</div>
      </div>
    </div>
  </div>

  <!-- 資料（更新名單只需要修改 data/phonebook-yilan.js） -->
  <script src="data/phonebook-yilan.js"></script>

  <!-- 共用功能 -->
  <script src="js/phonebook.js"></script>

  <!-- 初始化 -->
  <script>
    initPhonebook({
      data: PHONEBOOK_DATA,
      csvFilename: 'phonebook_yilan.csv',
      searchRoom: true
    });
  </script>
</body>
</html>
